<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Conference</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404040;
        }

        .meeting-info {
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-primary {
            background: #0e71eb;
            color: white;
        }

        .btn-danger {
            background: #eb0e0e;
            color: white;
        }

        .btn-secondary {
            background: #404040;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .main-content {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .video-container {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .video-item {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 10px;
            position: relative;
            min-height: 250px;
        }

        .video-element {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border-radius: 4px;
            object-fit: cover;
        }

        .user-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .controls-sidebar {
            flex: 1;
            max-width: 300px;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            max-height: 400px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #404040;
            color: white;
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-form {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            text-align: center;
        }

        .login-form h2 {
            margin-bottom: 20px;
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            background: #404040;
            color: white;
        }

        .hidden {
            display: none;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .status-online {
            background: #00ff00;
        }

        .system-message {
            color: #888;
            font-style: italic;
            font-size: 12px;
            text-align: center;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-form">
            <h2>Присоединиться к конференции</h2>
            <input type="text" id="usernameInput" placeholder="Ваше имя" value="User1">
            <input type="text" id="roomInput" placeholder="ID комнаты" value="room1">
            <button class="btn btn-primary" onclick="joinConference()">Присоединиться</button>
        </div>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <div class="meeting-info">
                <span class="status-indicator status-online"></span>
                Конференция: <span id="roomName">-</span> | 
                Участников: <span id="usersCount">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" onclick="toggleAudio()">
                    <span id="audioIcon">🔊</span> Аудио
                </button>
                <button class="btn btn-secondary" onclick="toggleVideo()">
                    <span id="videoIcon">📹</span> Видео
                </button>
                <button class="btn btn-danger" onclick="leaveConference()">
                    📞 Выйти
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="video-container" id="videoContainer">
                <!-- Видео элементы будут добавляться здесь -->
            </div>

            <div class="controls-sidebar">
                <h3>Чат</h3>
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Введите сообщение..." onkeypress="handleChatKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendMessage()">Отпр.</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VideoConference {
            constructor() {
                this.socket = null;
                this.localStream = null;
                this.peerConnections = {};
                this.mediaConstraints = {
                    video: true,
                    audio: true
                };
                this.currentRoom = null;
                this.username = null;
                this.audioEnabled = true;
                this.videoEnabled = true;
                this.connectedUsers = {};
            }

            async init() {
                try {
                    this.socket = io();
                    this.setupSocketListeners();
                } catch (error) {
                    console.error('Error initializing conference:', error);
                    alert('Ошибка подключения к серверу');
                }
            }

            setupSocketListeners() {
                this.socket.on('user_joined', (data) => {
                    this.handleUserJoined(data);
                });

                this.socket.on('user_left', (data) => {
                    this.handleUserLeft(data);
                });

                this.socket.on('current_users', (data) => {
                    data.users.forEach(user => {
                        this.connectedUsers[user.user_id] = user.username;
                        this.createPeerConnection(user.user_id);
                    });
                });

                this.socket.on('webrtc_offer', (data) => {
                    this.handleOffer(data);
                });

                this.socket.on('webrtc_answer', (data) => {
                    this.handleAnswer(data);
                });

                this.socket.on('ice_candidate', (data) => {
                    this.handleIceCandidate(data);
                });

                this.socket.on('chat_message', (data) => {
                    this.displayChatMessage(data);
                });

                this.socket.on('room_info', (data) => {
                    console.log('Room info:', data);
                });
            }

            async joinRoom(roomId, username) {
                this.currentRoom = roomId;
                this.username = username;

                try {
                    await this.getUserMedia();
                } catch (error) {
                    console.error('Error accessing media:', error);
                    // Продолжаем без медиа
                }

                this.socket.emit('join_room', {
                    room: roomId,
                    username: username
                });

                document.getElementById('roomName').textContent = roomId;
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
            }

            async getUserMedia() {
                try {
                    this.localStream = await navigator.mediaDevices.getUserMedia(this.mediaConstraints);
                    this.addLocalVideo();
                } catch (error) {
                    console.error('Error accessing media devices:', error);
                    // Создаем placeholder вместо видео
                    this.addLocalVideoPlaceholder();
                }
            }

            addLocalVideo() {
                const videoContainer = document.getElementById('videoContainer');
                const videoElement = document.createElement('video');
                videoElement.id = 'localVideo';
                videoElement.className = 'video-element';
                videoElement.autoplay = true;
                videoElement.muted = true;
                videoElement.playsInline = true;
                videoElement.srcObject = this.localStream;

                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <div class="user-info">${this.username} (Вы)</div>
                `;
                videoItem.appendChild(videoElement);
                videoContainer.appendChild(videoItem);
            }

            addLocalVideoPlaceholder() {
                const videoContainer = document.getElementById('videoContainer');
                const placeholder = document.createElement('div');
                placeholder.className = 'video-item';
                placeholder.innerHTML = `
                    <div style="width: 100%; height: 200px; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px;">
                        <div style="text-align: center;">
                            <div style="font-size: 48px;">📹</div>
                            <div>Камера недоступна</div>
                        </div>
                    </div>
                    <div class="user-info">${this.username} (Вы)</div>
                `;
                videoContainer.appendChild(placeholder);
            }

            createPeerConnection(userId) {
                const configuration = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                };

                const peerConnection = new RTCPeerConnection(configuration);
                this.peerConnections[userId] = peerConnection;

                // Добавляем локальный поток если есть
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, this.localStream);
                    });
                }

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.socket.emit('ice_candidate', {
                            target_user: userId,
                            candidate: event.candidate
                        });
                    }
                };

                peerConnection.ontrack = (event) => {
                    const username = this.connectedUsers[userId] || userId;
                    this.addRemoteVideo(userId, event.streams[0], username);
                };

                // Создаем и отправляем offer
                this.createOffer(userId);
            }

            async createOffer(userId) {
                try {
                    const offer = await this.peerConnections[userId].createOffer();
                    await this.peerConnections[userId].setLocalDescription(offer);
                    
                    this.socket.emit('webrtc_offer', {
                        target_user: userId,
                        offer: offer
                    });
                } catch (error) {
                    console.error('Error creating offer:', error);
                }
            }

            async handleOffer(data) {
                const userId = data.from_user;
                if (!this.peerConnections[userId]) {
                    this.createPeerConnection(userId);
                }

                try {
                    await this.peerConnections[userId].setRemoteDescription(data.offer);
                    const answer = await this.peerConnections[userId].createAnswer();
                    await this.peerConnections[userId].setLocalDescription(answer);
                    
                    this.socket.emit('webrtc_answer', {
                        target_user: userId,
                        answer: answer
                    });
                } catch (error) {
                    console.error('Error handling offer:', error);
                }
            }

            async handleAnswer(data) {
                const userId = data.from_user;
                try {
                    await this.peerConnections[userId].setRemoteDescription(data.answer);
                } catch (error) {
                    console.error('Error handling answer:', error);
                }
            }

            async handleIceCandidate(data) {
                const userId = data.from_user;
                try {
                    if (this.peerConnections[userId]) {
                        await this.peerConnections[userId].addIceCandidate(data.candidate);
                    }
                } catch (error) {
                    console.error('Error adding ICE candidate:', error);
                }
            }

            handleUserJoined(data) {
                this.connectedUsers[data.user_id] = data.username;
                document.getElementById('usersCount').textContent = data.users_count;
                this.createPeerConnection(data.user_id);
                
                this.displaySystemMessage(`${data.username} присоединился к конференции`);
            }

            handleUserLeft(data) {
                document.getElementById('usersCount').textContent = 
                    parseInt(document.getElementById('usersCount').textContent) - 1;
                
                this.removeRemoteVideo(data.user_id);
                
                if (this.peerConnections[data.user_id]) {
                    this.peerConnections[data.user_id].close();
                    delete this.peerConnections[data.user_id];
                }
                
                if (this.connectedUsers[data.user_id]) {
                    this.displaySystemMessage(`${this.connectedUsers[data.user_id]} покинул конференцию`);
                    delete this.connectedUsers[data.user_id];
                }
            }

            addRemoteVideo(userId, stream, username) {
                const videoContainer = document.getElementById('videoContainer');
                this.removeRemoteVideo(userId);

                const videoElement = document.createElement('video');
                videoElement.id = `remoteVideo_${userId}`;
                videoElement.className = 'video-element';
                videoElement.autoplay = true;
                videoElement.playsInline = true;
                videoElement.srcObject = stream;

                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.id = `videoItem_${userId}`;
                videoItem.innerHTML = `
                    <div class="user-info">${username}</div>
                `;
                videoItem.appendChild(videoElement);
                videoContainer.appendChild(videoItem);
            }

            removeRemoteVideo(userId) {
                const videoItem = document.getElementById(`videoItem_${userId}`);
                if (videoItem) {
                    videoItem.remove();
                }
            }

            toggleAudio() {
                if (!this.localStream) return;
                
                this.audioEnabled = !this.audioEnabled;
                const audioTracks = this.localStream.getAudioTracks();
                audioTracks.forEach(track => {
                    track.enabled = this.audioEnabled;
                });
                
                document.getElementById('audioIcon').textContent = 
                    this.audioEnabled ? '🔊' : '🔇';
                
                this.socket.emit('toggle_audio', { enabled: this.audioEnabled });
            }

            toggleVideo() {
                if (!this.localStream) return;
                
                this.videoEnabled = !this.videoEnabled;
                const videoTracks = this.localStream.getVideoTracks();
                videoTracks.forEach(track => {
                    track.enabled = this.videoEnabled;
                });
                
                document.getElementById('videoIcon').textContent = 
                    this.videoEnabled ? '📹' : '📷';
                
                this.socket.emit('toggle_video', { enabled: this.videoEnabled });
            }

            sendMessage() {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                
                if (message) {
                    this.socket.emit('chat_message', {
                        message: message,
                        timestamp: new Date().toLocaleTimeString()
                    });
                    
                    input.value = '';
                }
            }

            displayChatMessage(data) {
                const chatMessages = document.getElementById('chatMessages');
                const messageElement = document.createElement('div');
                messageElement.innerHTML = `
                    <strong>${data.username}:</strong> ${data.message}
                    <small style="color: #888;">${data.timestamp}</small>
                `;
                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            displaySystemMessage(message) {
                const chatMessages = document.getElementById('chatMessages');
                const messageElement = document.createElement('div');
                messageElement.className = 'system-message';
                messageElement.textContent = `⚡ ${message}`;
                chatMessages.appendChild(messageElement);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            leaveConference() {
                Object.values(this.peerConnections).forEach(pc => pc.close());
                
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                }
                
                document.getElementById('app').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('videoContainer').innerHTML = '';
                document.getElementById('chatMessages').innerHTML = '';
                
                this.peerConnections = {};
                this.connectedUsers = {};
                this.localStream = null;
            }
        }

        let conference;

        function joinConference() {
            const username = document.getElementById('usernameInput').value || 'User';
            const roomId = document.getElementById('roomInput').value || 'room1';
            
            if (!username.trim()) {
                alert('Пожалуйста, введите имя');
                return;
            }
            
            if (!conference) {
                conference = new VideoConference();
                conference.init().then(() => {
                    conference.joinRoom(roomId, username);
                });
            } else {
                conference.joinRoom(roomId, username);
            }
        }

        function toggleAudio() {
            if (conference) conference.toggleAudio();
        }

        function toggleVideo() {
            if (conference) conference.toggleVideo();
        }

        function sendMessage() {
            if (conference) conference.sendMessage();
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function leaveConference() {
            if (conference) conference.leaveConference();
        }

        window.addEventListener('load', () => {
            conference = new VideoConference();
            conference.init();
        });
    </script>
</body>
</html>
